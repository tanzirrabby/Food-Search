<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Food Fetch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
 
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-100 to-green-300 p-6">
  <div class="max-w-4xl w-full text-center">
   
    <h1 class="text-5xl md:text-6xl font-extrabold text-green-800 mb-8 drop-shadow-lg font-[‘Comic_Sans_MS’,cursive]">
      Mayer Dowa Restaurant
    </h1>

    
    <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-10">
      <input id="country" type="text" 
             placeholder="Enter country (Kon Desher khana chaw?)"
             class="w-full md:w-96 p-4 text-lg md:text-xl rounded-xl border-2 border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none shadow-md font-[‘Comic_Sans_MS’,cursive]">
      <button id="search" 
              class="w-full md:w-auto px-6 py-4 text-lg md:text-xl bg-green-700 hover:bg-green-800 text-white font-bold rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105">
        Search
      </button>
    </div>

    
    <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 mt-6"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
